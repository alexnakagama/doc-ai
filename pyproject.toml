[project]
name = "doc-ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "alexnakagama", email = "alexnakagama4@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "langchain-openai>=1.6.6",
    "langchain-text-splitters>=1.1.2",
    "numpy>=2.5.3",
    "pymupdf>=1.28.2",
    "python-multipart>=0.0.32",
    "uvicorn>=0.54.0",
]

[project.scripts]
doc-ai = "doc_ai:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
